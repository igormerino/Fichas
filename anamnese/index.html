<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anamnese · Consultoria Igor Merino</title>
<meta name="description" content="Anamnese da consultoria de treino online.">
<meta property="og:title" content="Anamnese · Consultoria Igor Merino">
<meta property="og:description" content="Responda para eu montar o seu treino.">
<meta property="og:image" content="../icone-512.png">
<meta name="theme-color" content="#0E0E0E">
<link rel="icon" href="../icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,700..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F2EE;--surface:#fff;--ink:#111110;--muted:#6F6B65;--line:#DEDAD3;--band:#0E0E0E;--field:#F1EFEA}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
[hidden]{display:none!important}
header{background:var(--band);color:#fff;padding:18px 20px 16px}
header .k{font:600 11px/1 Inter;letter-spacing:.2em;text-transform:uppercase;color:#9a968f}
header .bar{height:5px;background:#2a2a2a;margin-top:14px;border-radius:3px;overflow:hidden}
header .bar i{display:block;height:100%;background:#fff;width:0;transition:width .3s}
main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:26px 20px 30px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:Archivo,'Arial Narrow',sans-serif;font-stretch:80%;font-weight:900;text-transform:uppercase;margin:0 0 0 -4px;line-height:1.42}
h1{font-size:40px}h2{font-size:29px}
h1 span,h2 span{background:var(--band);color:#fff;padding:1px 9px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
p{margin:0}.lead{font-size:17px}.muted{color:var(--muted);font-size:14px}
.opts{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{border:1.5px solid var(--ink);padding:8px 12px;font:700 12px/1 Inter;letter-spacing:.12em;text-transform:uppercase}
.op{font:600 16px/1.3 Inter;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;display:flex;gap:12px;align-items:center}
.op:before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);flex:none}
.op[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.op[aria-pressed="true"]:before{background:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.op small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:3px}
label.f{display:flex;flex-direction:column;gap:6px;font:600 12px/1 Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input,textarea{font:500 17px/1.3 Inter;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,.op:focus-visible,.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{border:0;background:var(--ink);color:var(--bg);font:700 14px/1 Inter;letter-spacing:.08em;text-transform:uppercase;padding:18px;border-radius:10px;cursor:pointer;text-align:center;text-decoration:none;display:block;width:100%}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.nav{display:flex;gap:10px;margin-top:auto;padding-top:10px}.nav .btn.ghost{flex:0 0 34%}
.card{background:var(--surface);border-left:5px solid var(--ink);padding:14px 16px}
.inc{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.card b{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.dk{background:var(--band);color:#fff;padding:18px}.dk p{color:#E6E3DD}
.lst{display:flex;flex-direction:column;gap:8px;margin:4px 0}
.lst div{background:var(--surface);padding:12px 14px;border-left:5px solid var(--ink);font-size:15px}
.err{color:#B42318;font-size:14px}
footer{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);max-width:520px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font:800 11px/1 Archivo;font-stretch:90%;letter-spacing:.22em;color:var(--ink)}
.pul{width:26px;height:9px;border-radius:5px;background:var(--band)}

.campo{display:flex;flex-direction:column;gap:8px}
.campo>span{font:600 15px/1.35 Inter;color:var(--ink)}
.campo>span small{font-weight:400;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 15px/1 Inter;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:12px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.aceite{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px;font-size:15px}
.aceite input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:#111}
.campo.erro>span{color:#B42318}
</style>
</head><body>
<header><div class="k">Anamnese · Consultoria Igor Merino</div><div class="bar"><i id="barra"></i></div></header>
<main id="app"></main>
<footer><span class="brand"><span class="pul"></span>IGOR MERINO</span><span>Músculo é seguro de vida.</span></footer>
<script>
const WHATSAPP = '5565996856769';
const KEY = 'anamnese-igor';
// tipos: t = texto, n = número, c = escolha (uma), yn = sim/não com detalhe, a = texto longo
const S = [
  { t: 'Seus dados', f: [
    ['nome', 'Nome completo', 't', 1], ['idade', 'Idade', 'n', 1], ['sexo', 'Sexo', 'c', 1, ['Masculino', 'Feminino']],
    ['peso', 'Peso (kg)', 'n', 1], ['altura', 'Altura (cm)', 'n', 1], ['cidade', 'Cidade', 't', 1]] },
  { t: 'Sua saúde', d: 'Se alguma resposta for "sim", pode ser preciso uma liberação médica antes de começar.', f: [
    ['coracao', 'Algum médico já disse que você tem problema no coração ou pressão alta?', 'c', 1, ['Não', 'Sim']],
    ['peito', 'Sente dor no peito em repouso ou durante esforço?', 'c', 1, ['Não', 'Sim']],
    ['tontura', 'Perdeu o equilíbrio por tontura ou desmaiou nos últimos 12 meses?', 'c', 1, ['Não', 'Sim']],
    ['doenca', 'Tem alguma doença diagnosticada? (diabetes, tireoide, outra)', 'yn', 1, 'Qual?'],
    ['remedio', 'Usa algum medicamento? (inclui canetas emagrecedoras)', 'yn', 1, 'Qual?'],
    ['lesao', 'Tem ou teve lesão, cirurgia ou dor em articulação ou coluna?', 'yn', 1, 'Onde e quando?'],
    ['liberacao', 'Tem liberação médica para treinar?', 'c', 1, ['Sim', 'Não', 'Nunca fiz avaliação']]] },
  { t: 'Seu treino', f: [
    ['tempo_treino', 'Há quanto tempo treina musculação sem parar?', 'c', 1, ['Não treino', 'Menos de 6 meses', '6 meses a 2 anos', 'Mais de 2 anos']],
    ['dias', 'Quantos dias por semana pode treinar?', 'c', 1, ['2', '3', '4', '5', '6']],
    ['duracao', 'Quanto tempo por treino?', 'c', 1, ['Até 45 min', '45 min a 1h', '1h a 1h30', 'Mais de 1h30']],
    ['horario', 'Em que horário costuma treinar?', 't', 0],
    ['local', 'Onde treina?', 'c', 1, ['Academia completa', 'Academia do condomínio', 'Em casa']],
    ['equip', 'Que equipamentos tem? (se não for academia completa)', 't', 0],
    ['outra', 'Faz outra atividade? (corrida, luta, futebol, bike) Quantas vezes por semana?', 't', 0],
    ['nao_gosta', 'Algum exercício que não gosta ou não consegue fazer?', 't', 0],
    ['viaja', 'Viaja com frequência?', 'c', 1, ['Não', 'Às vezes', 'Com frequência']]] },
  { t: 'Seu objetivo', f: [
    ['objetivo', 'Qual o seu objetivo principal?', 'c', 1, ['Ganhar massa muscular', 'Emagrecer sem perder músculo', 'Força e desempenho', 'Saúde e disposição']],
    ['foco', 'Que parte do corpo você mais quer desenvolver?', 't', 1],
    ['tres_meses', 'Onde você quer estar daqui a 3 meses?', 'a', 1]] },
  { t: 'Sua rotina', f: [
    ['sono', 'Quantas horas dorme por noite?', 'c', 1, ['Menos de 6', '6 a 7', '7 a 8', 'Mais de 8']],
    ['estresse', 'Como está o seu nível de estresse?', 'c', 1, ['Baixo', 'Médio', 'Alto']],
    ['trabalho', 'Como é a sua rotina de trabalho?', 't', 0],
    ['nutri', 'Tem acompanhamento nutricional hoje?', 'c', 1, ['Sim', 'Não']]] },
  { t: 'Ponto de partida', d: 'Opcional, mas ajuda a ver sua evolução no fim do ciclo.', f: [
    ['cintura', 'Medida da cintura na altura do umbigo (cm)', 'n', 0],
    ['cargas', 'Cargas atuais em 2 exercícios (ex.: supino 20 kg x 10, agachamento 40 kg x 12)', 'a', 0]] },
  { t: 'Para finalizar', f: [['termo', 'Declaro que as informações são verdadeiras e que vou avisar sobre qualquer dor ou mudança na minha saúde.', 'ok', 1]] },
];
let R = {}; try { R = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
let i = R._passo || 0;
const salvar = () => { R._passo = i; try { localStorage.setItem(KEY, JSON.stringify(R)); } catch (e) {} };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const app = document.getElementById('app');

function campo(f) {
  const [id, rot, tp, req, x] = f, v = R[id] || '';
  const lbl = `<span>${rot}${req ? '' : ' <small>(opcional)</small>'}</span>`;
  if (tp === 'c') return `<div class="campo" id="c_${id}">${lbl}<div class="chips">${x.map(o => `<button class="chip" data-id="${id}" data-v="${esc(o)}" aria-pressed="${v === o}">${o}</button>`).join('')}</div></div>`;
  if (tp === 'yn') return `<div class="campo" id="c_${id}">${lbl}<div class="chips">${['Não', 'Sim'].map(o => `<button class="chip" data-id="${id}" data-v="${o}" aria-pressed="${v === o}">${o}</button>`).join('')}</div><input id="${id}_det" placeholder="${x}" value="${esc(R[id + '_det'])}" ${v === 'Sim' ? '' : 'hidden'}></div>`;
  if (tp === 'a') return `<label class="campo" id="c_${id}">${lbl}<textarea id="${id}">${esc(v)}</textarea></label>`;
  if (tp === 'ok') return `<label class="aceite" id="c_${id}"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}><span>${rot}</span></label>`;
  return `<label class="campo" id="c_${id}">${lbl}<input id="${id}" ${tp === 'n' ? 'inputmode="decimal"' : ''} value="${esc(v)}" ${id === 'nome' ? 'autocomplete="name"' : ''}></label>`;
}
function tela() {
  document.getElementById('barra').style.width = i < 0 ? '0' : Math.min(100, (i / S.length) * 100) + '%';
  if (i < 0) i = 0;
  if (i >= S.length) return fim();
  const s = S[i];
  app.innerHTML = (i === 0 ? `<h1><span>Vamos montar o seu treino.</span></h1><p class="lead">Responda com calma. Cada resposta vira uma parte do seu treino. Leva uns 5 minutos, e o que você preencher fica salvo neste celular.</p>` : '')
    + `<p class="muted">Parte ${i + 1} de ${S.length}</p><h2><span>${s.t}</span></h2>${s.d ? `<p class="muted">${s.d}</p>` : ''}`
    + s.f.map(campo).join('')
    + `<p class="err" id="err" hidden>Responda os campos destacados.</p>`
    + `<div class="nav">${i > 0 ? '<button class="btn ghost" id="voltar">Voltar</button>' : ''}<button class="btn" id="seguir">${i === S.length - 1 ? 'Concluir' : 'Continuar'}</button></div>`;
  window.scrollTo(0, 0);
}
function ler() {
  S[i].f.forEach(([id, , tp]) => {
    const el = document.getElementById(id);
    if (tp === 'ok') R[id] = el.checked ? 'Sim' : '';
    else if (tp === 'yn') R[id + '_det'] = document.getElementById(id + '_det').value.trim();
    else if (el) R[id] = el.value.trim();
  });
  salvar();
}
function valido() {
  let ok = true;
  S[i].f.forEach(([id, , , req]) => { const vazio = req && !R[id]; document.getElementById('c_' + id).classList.toggle('erro', !!vazio); if (vazio) ok = false; });
  document.getElementById('err').hidden = ok; return ok;
}
function mensagem() {
  const v = id => R[id] || '–', yn = id => R[id] === 'Sim' ? 'Sim, ' + (R[id + '_det'] || 'sem detalhe') : v(id);
  const alerta = ['coracao', 'peito', 'tontura'].some(k => R[k] === 'Sim');
  const L = ['*ANAMNESE · CONSULTORIA*', '',
    '*Dados*', `Nome: ${v('nome')}`, `Idade: ${v('idade')} · Sexo: ${v('sexo')}`, `Peso: ${v('peso')} kg · Altura: ${v('altura')} cm`, `Cidade: ${v('cidade')}`, '',
    '*Saúde*' + (alerta ? ' ⚠️ pedir liberação médica' : ''), `Coração/pressão: ${v('coracao')}`, `Dor no peito: ${v('peito')}`, `Tontura/desmaio: ${v('tontura')}`,
    `Doença: ${yn('doenca')}`, `Medicamento: ${yn('remedio')}`, `Lesão/dor: ${yn('lesao')}`, `Liberação médica: ${v('liberacao')}`, '',
    '*Treino*', `Treina há: ${v('tempo_treino')}`, `Dias por semana: ${v('dias')} · Tempo: ${v('duracao')}`, `Horário: ${v('horario')}`, `Local: ${v('local')}`, `Equipamentos: ${v('equip')}`,
    `Outra atividade: ${v('outra')}`, `Não gosta/não consegue: ${v('nao_gosta')}`, `Viaja: ${v('viaja')}`, '',
    '*Objetivo*', `Principal: ${v('objetivo')}`, `Quer desenvolver: ${v('foco')}`, `Em 3 meses: ${v('tres_meses')}`, '',
    '*Rotina*', `Sono: ${v('sono')} h · Estresse: ${v('estresse')}`, `Trabalho: ${v('trabalho')}`, `Acompanhamento nutricional: ${v('nutri')}`, '',
    '*Ponto de partida*', `Cintura: ${R.cintura ? R.cintura + ' cm' : '–'}`, `Cargas atuais: ${v('cargas')}`, '', 'Termo aceito: Sim'];
  return `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(L.join('\n'))}`;
}
function fim() {
  document.getElementById('barra').style.width = '100%';
  app.innerHTML = `<h1><span>Pronto, ${esc((R.nome || '').split(' ')[0])}!</span></h1>
    <p class="lead">Agora é só me enviar. A mensagem já vai organizada no WhatsApp, é só tocar em enviar.</p>
    <div class="dk"><p>Com as suas respostas eu monto o seu treino em até 3 dias e te mando por lá.</p></div>
    <a class="btn" href="${mensagem()}" target="_blank" rel="noopener">Enviar no WhatsApp</a>
    <button class="btn ghost" id="voltar">Revisar respostas</button>`;
}
app.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.id) {
    R[b.dataset.id] = b.dataset.v; salvar();
    b.parentNode.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
    const det = document.getElementById(b.dataset.id + '_det'); if (det) { det.hidden = b.dataset.v !== 'Sim'; if (!det.hidden) det.focus(); }
    document.getElementById('c_' + b.dataset.id).classList.remove('erro');
  } else if (b.id === 'seguir') { ler(); if (!valido()) return; i++; salvar(); tela(); }
  else if (b.id === 'voltar') { if (i < S.length) ler(); i--; salvar(); tela(); }
});
tela();
</script>
</body></html>
