<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E0E0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu treino">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Meu treino · Exemplo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: ficha de academia no celular — cabeçalho preto, abas de treino, cartões de exercício com campos grandes para o polegar */
:root{
  --bg:#F4F2EE; --surface:#FFFFFF; --ink:#111110; --muted:#6F6B65; --line:#DEDAD3; --band:#0E0E0E; --band-ink:#FFFFFF; --field:#F1EFEA; --ok:#1F7A3E;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0E0E;--surface:#1A1A19;--ink:#F2F0EC;--muted:#A19D96;--line:#2E2D2B;--band:#000000;--band-ink:#FFFFFF;--field:#252523;--ok:#5BC27F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0E0E;--surface:#1A1A19;--ink:#F2F0EC;--muted:#A19D96;--line:#2E2D2B;--band:#000000;--band-ink:#FFFFFF;--field:#252523;--ok:#5BC27F;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--band);color:var(--band-ink)}
header .wrap{padding-block:22px 18px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:#9A968F}
h1{font-family:var(--display);font-stretch:80%;font-weight:900;text-transform:uppercase;font-size:30px;line-height:1;margin:4px 0 0;text-wrap:balance}
.meta{font-size:13px;color:#CFCBC4}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.sticky .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:6px}
.seg{flex:1;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:700 13px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:11px 4px;border-radius:999px;cursor:pointer}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tab{flex:1;min-width:0;border:0;background:var(--surface);color:var(--ink);padding:10px 6px;cursor:pointer;border-bottom:3px solid transparent;text-align:left}
.tab b{display:block;font-family:var(--display);font-stretch:80%;font-weight:900;font-size:22px;line-height:1}
.tab span{font-size:11px;color:var(--muted);display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{border-bottom-color:var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main .wrap{padding-block:16px 40px;display:flex;flex-direction:column;gap:12px}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.title h2{font-family:var(--display);font-stretch:80%;font-weight:900;text-transform:uppercase;font-size:20px;margin:0}
.title h2 mark{background:var(--band);color:var(--band-ink);padding:1px 8px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.progress{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ex{background:var(--surface);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.ex.done{border-color:var(--ok)}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exname{font-weight:700;font-size:15px;line-height:1.3}
.alt{font-size:12px;color:var(--muted);margin-top:2px}
.vid{flex:none;font:700 11px/1 var(--body);letter-spacing:.08em;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:4px;padding:6px 7px}
.spec{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.spec div{background:var(--field);padding:6px 4px;text-align:center}
.spec small{display:block;font:600 9.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.spec b{font-size:13px;font-variant-numeric:tabular-nums}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inputs label{display:flex;flex-direction:column;gap:4px;font:600 10.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.inputs input{font:600 18px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:6px;padding:11px 10px;width:100%;min-width:0}
.prev{font-size:12px;color:var(--muted)}
.prev b{color:var(--ink)}
.cardio{background:var(--band);color:var(--band-ink);padding:14px}
.cardio .eyebrow{margin-bottom:6px}
.cardio p{margin:3px 0;font-size:14px;color:#E6E3DD}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.btn{border:0;background:var(--ink);color:var(--bg);font:700 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:15px;border-radius:6px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.note{font-size:12px;color:var(--muted);text-align:center}
table{border-collapse:collapse;width:100%;background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
.tablebox{overflow-x:auto}
th{background:var(--band);color:var(--band-ink);font:700 10px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:9px 6px;text-align:center}
th:first-child,td:first-child{text-align:left}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:10px;font-size:12px;color:var(--muted)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-stretch:90%;font-weight:800;letter-spacing:.24em;font-size:11px;text-transform:uppercase;color:var(--ink)}
.pul{width:28px;height:10px;border-radius:5px;background:var(--ink);position:relative}
.pul::after{content:"";position:absolute;left:7px;right:7px;top:4.5px;height:1px;background:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.ex{transition:border-color .2s}}
</style>
</head><body>


<header><div class="wrap">
  <span class="eyebrow">Consultoria de treino · Igor Merino</span>
  <h1 id="nome">Nome do Aluno</h1>
  <span class="meta" id="ciclo">Ciclo 1 · 4 semanas</span>
</div></header>

<div class="sticky"><div class="wrap">
  <div class="row" id="semanas" role="group" aria-label="Semana"></div>
  <div class="row" id="abas" role="tablist"></div>
</div></div>

<main><div class="wrap" id="conteudo"></div></main>
<div class="toast" id="toast" hidden></div>

<script>
// Dados do aluno: o gerador troca este bloco a cada consultoria.
const DADOS = {"id":"exemplo-e950cb","aluno":"Exemplo","ciclo":"Ciclo 1 · 4 semanas","treinos":[{"letra":"A","titulo":"Peitoral, ombros e tríceps","exercicios":[["Supino inclinado com halteres",[3,3,3,4],"12 a 15","1–2","1'30","1-0-3-0","Supino inclinado na máquina",""],["Crucifixo no banco ou na polia",[3,3,3,4],"12 a 15","1–2","1'","1-0-3-0","Peck deck",""],["Supino declinado com halteres",[3,3,3,4],"12 a 15","1–2","1'","1-0-3-0","Paralelas assistidas",""],["Supino reto",[2,2,2,2],"8 a 10","1–2","2'","1-0-3-0","Supino reto na máquina",""],["Desenvolvimento máquina + Rosca martelo",[3,3,3,3],"10 a 12","1–2","1'","1-0-3-0","Desenvolvimento com halteres",""],["Elevação lateral + Tríceps testa no banco",[3,3,3,3],"12 a 15","1–2","1'","1-0-3-0","Elevação lateral na polia",""],["Elevação frontal + Tríceps barra V na polia",[3,3,3,3],"12 a 15","0–1","1'","1-0-3-0","Tríceps corda",""]],"cardio":{"titulo":"Corrida","semanas":["30'","30'","30'","30'"],"linhas":[["Aquecimento","5' caminhando","5"],["Estímulo","30' corrida","6–7"],["Volta à calma","2' caminhando","4"]]}},{"letra":"B","titulo":"Membros inferiores","exercicios":[["Agachamento no Smith",[3,3,3,3],"12 a 15","1–2","1'30","1-0-3-0","Agachamento no hack",""],["Leg press",[3,3,3,4],"12 a 15","1–2","1'30","1-0-3-0","Agachamento goblet",""],["Cadeira extensora + Stiff com halteres",[3,3,3,4],"12 a 15","1–2","1'","1-0-3-0","Afundo + Stiff com barra",""],["Cadeira abdutora + Flexora",[4,4,4,4],"8 a 10","1–2","1'","1-0-3-0","Abdução no cabo + Mesa flexora",""],["Recuo com halteres",[3,3,3,3],"10 a 12","1–2","1'","1-0-3-0","Afundo no Smith",""],["Agachamento búlgaro",[3,3,3,3],"12 a 15","1–2","1'","1-0-3-0","Passada",""],["Panturrilha em pé com peso",[5,5,5,5],"12 a 15","0–1","45\"","1-1-3-0","Panturrilha no leg press",""]],"cardio":{"titulo":"Bike","semanas":["30'","30'","30'","30'"],"linhas":[["Aquecimento","5' leve","5"],["Estímulo","Bike para poupar joelho e articulações exigidas na corrida","5–6"]]}},{"letra":"C","titulo":"Costas, trapézio e bíceps","exercicios":[["Barra fixa",[2,2,3,3],"10","1–2","1'30","1-0-1-0","Barra no graviton",""],["Remada sentado",[3,3,3,4],"8 a 10","1–2","1'30","1-0-3-0","Remada curvada com barra",""],["Voador invertido na máquina",[3,3,3,4],"12 a 15","1–2","1'","1-0-3-0","Crucifixo inverso com halteres",""],["Puxada alta",[4,4,4,4],"8 a 10","1–2","1'30","1-0-3-0","Puxada com triângulo",""],["Remada sentado com cotovelos altos",[3,3,3,4],"12 a 15","1–2","1'","1-0-3-0","Face pull",""],["Barra W sentado + Encolhimento com halteres",[3,3,3,3],"12 a 15","1–2","1'","1-0-3-0","Rosca na polia + Encolhimento no Smith",""],["Rosca direta + Encolhimento na polia",[3,3,3,3],"12 a 15","0–1","1'","1-0-3-0","Rosca alternada",""]],"cardio":{"titulo":"Tiros","semanas":["10 × 200 m","10 × 300 m","10 × 400 m","5 × 400 m"],"linhas":[["Aquecimento","10' trote","6"],["Estímulo","Tiros da semana + 2 km contínuos","9 / 7"],["Volta à calma","5' caminhando","4"]]}}]};

const KEY = 'ficha-' + DADOS.id;
let reg = {};
try { reg = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { reg = {}; }
let ui = { semana: 0, aba: 0 };
try { Object.assign(ui, JSON.parse(localStorage.getItem(KEY + '-ui') || '{}')); } catch (e) {}
const salvar = () => { try { localStorage.setItem(KEY, JSON.stringify(reg)); localStorage.setItem(KEY + '-ui', JSON.stringify(ui)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const k = (t, e, s) => `${t}-${e}-${s}`;

document.getElementById('nome').textContent = DADOS.aluno;
document.getElementById('ciclo').textContent = DADOS.ciclo;
const nAbas = DADOS.treinos.length + 1; // + histórico

function topo() {
  document.getElementById('semanas').innerHTML = [0, 1, 2, 3].map(i =>
    `<button class="seg" id="sem${i}" aria-pressed="${ui.semana === i && ui.aba < DADOS.treinos.length}" data-s="${i}">Sem. ${i + 1}</button>`).join('');
  document.getElementById('abas').innerHTML = DADOS.treinos.map((t, i) =>
    `<button class="tab" role="tab" id="aba${i}" aria-selected="${ui.aba === i}" data-a="${i}"><b>${t.letra}</b><span>${esc(t.titulo)}</span></button>`).join('') +
    `<button class="tab" role="tab" id="aba${DADOS.treinos.length}" aria-selected="${ui.aba === DADOS.treinos.length}" data-a="${DADOS.treinos.length}"><b>↗</b><span>Evolução</span></button>`;
}

function treino() {
  const t = DADOS.treinos[ui.aba], s = ui.semana;
  const feitos = t.exercicios.filter((_, e) => (reg[k(ui.aba, e, s)] || {}).c).length;
  let h = `<div class="title"><h2><mark>Treino ${t.letra}</mark></h2><span class="progress">${feitos}/${t.exercicios.length} anotados · semana ${s + 1}</span></div>`;
  t.exercicios.forEach((x, e) => {
    const r = reg[k(ui.aba, e, s)] || {}, ant = s > 0 ? reg[k(ui.aba, e, s - 1)] : null;
    h += `<article class="ex ${r.c ? 'done' : ''}" id="ex${e}">
      <div class="exhead"><div><div class="exname">${esc(x[0])}</div><div class="alt">Alternativa: ${esc(x[6])}</div></div>${x[7] ? `<a class="vid" href="${esc(x[7])}" target="_blank" rel="noopener">VÍDEO</a>` : ''}</div>
      <div class="spec"><div><small>Séries</small><b>${x[1][s]}</b></div><div><small>Reps</small><b>${esc(x[2])}</b></div><div><small>RIR</small><b>${esc(x[3])}</b></div><div><small>Desc.</small><b>${esc(x[4])}</b></div></div>
      <div class="inputs">
        <label for="c-${e}">Carga (kg)<input id="c-${e}" inputmode="decimal" placeholder="—" value="${esc(r.c || '')}" data-e="${e}" data-f="c"></label>
        <label for="r-${e}">Reps na última série<input id="r-${e}" inputmode="numeric" placeholder="—" value="${esc(r.r || '')}" data-e="${e}" data-f="r"></label>
      </div>
      ${ant && ant.c ? `<div class="prev">Semana ${s}: <b>${esc(ant.c)} kg × ${esc(ant.r || '?')}</b></div>` : ''}
    </article>`;
  });
  const c = t.cardio;
  h += `<section class="cardio"><div class="eyebrow">Cardio · ${esc(c.titulo)} · semana ${s + 1}: ${esc(c.semanas[s])}</div>${c.linhas.map(l => `<p><b>${esc(l[0])}:</b> ${esc(l[1])} · escala ${esc(l[2])}</p>`).join('')}</section>`;
  h += rodape();
  return h;
}

function evolucao() {
  let h = `<div class="title"><h2><mark>Sua evolução</mark></h2></div><p class="note" style="text-align:left;margin:0">Carga (kg) e repetições da última série, semana a semana.</p>`;
  DADOS.treinos.forEach((t, a) => {
    h += `<div class="tablebox"><table><tr><th>Treino ${t.letra}</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th></tr>` +
      t.exercicios.map((x, e) => `<tr><td>${esc(x[0])}</td>${[0, 1, 2, 3].map(s => { const r = reg[k(a, e, s)] || {}; return `<td>${r.c ? esc(r.c) + (r.r ? '×' + esc(r.r) : '') : '–'}</td>`; }).join('')}</tr>`).join('') + `</table></div>`;
  });
  h += `<div class="actions"><button class="btn" id="copiar">Copiar minha evolução</button><button class="btn ghost" id="limpar">Apagar anotações</button><div id="confirma" hidden><p class="note">Apagar todas as anotações deste celular?</p><div class="row"><button class="btn" id="simLimpar" style="flex:1">Sim, apagar</button><button class="btn ghost" id="naoLimpar" style="flex:1">Cancelar</button></div></div></div>`;
  h += rodape();
  return h;
}

const rodape = () => `<p class="note">As anotações ficam salvas neste celular.</p><div class="foot"><span class="brand"><span class="pul"></span>Igor Merino</span><span>Músculo é seguro de vida.</span></div>`;

function render() { topo(); document.getElementById('conteudo').innerHTML = ui.aba < DADOS.treinos.length ? treino() : evolucao(); }

function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.s) { ui.semana = +b.dataset.s; if (ui.aba >= DADOS.treinos.length) ui.aba = 0; salvar(); render(); }
  else if (b.dataset.a) { ui.aba = +b.dataset.a; salvar(); render(); window.scrollTo({ top: 0 }); }
  else if (b.id === 'copiar') {
    const txt = DADOS.aluno + ' · evolução\n' + DADOS.treinos.map((t, a) => 'Treino ' + t.letra + '\n' + t.exercicios.map((x, e) => x[0] + ': ' + [0, 1, 2, 3].map(s => { const r = reg[k(a, e, s)] || {}; return r.c ? r.c + 'kg×' + (r.r || '?') : '–'; }).join(' | ')).join('\n')).join('\n\n');
    navigator.clipboard.writeText(txt).then(() => toast('Evolução copiada'), () => toast('Não foi possível copiar'));
  }
  else if (b.id === 'limpar') document.getElementById('confirma').hidden = false;
  else if (b.id === 'naoLimpar') document.getElementById('confirma').hidden = true;
  else if (b.id === 'simLimpar') { reg = {}; salvar(); render(); toast('Anotações apagadas'); }
});
document.addEventListener('input', ev => {
  const i = ev.target; if (!i.dataset.f) return;
  const id = k(ui.aba, +i.dataset.e, ui.semana); reg[id] = reg[id] || {}; reg[id][i.dataset.f] = i.value.trim(); salvar();
  const card = document.getElementById('ex' + i.dataset.e); card.classList.toggle('done', !!reg[id].c);
  const t = DADOS.treinos[ui.aba]; const f = t.exercicios.filter((_, e) => (reg[k(ui.aba, e, ui.semana)] || {}).c).length;
  document.querySelector('.progress').textContent = `${f}/${t.exercicios.length} anotados · semana ${ui.semana + 1}`;
});

// exemplo pré-preenchido na primeira abertura, para mostrar como fica
if (!Object.keys(reg).length && DADOS.id === 'exemplo') {
  reg = { '0-0-0': { c: '18', r: '13' }, '0-1-0': { c: '12', r: '15' }, '0-3-0': { c: '60', r: '9' }, '0-0-1': { c: '20', r: '12' } };
  ui.semana = 1;
}
render();
</script>

</body></html>
