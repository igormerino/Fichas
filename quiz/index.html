<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consultoria de treino · Igor Merino</title>
<meta name="description" content="Responda em 1 minuto e veja se a consultoria de treino online é para você.">
<meta property="og:title" content="Consultoria de treino online · Igor Merino">
<meta property="og:description" content="Responda em 1 minuto e veja se a consultoria é para você.">
<meta property="og:image" content="../icone-512.png">
<meta name="theme-color" content="#0E0E0E">
<link rel="icon" href="../icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,700..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F2EE;--surface:#fff;--ink:#111110;--muted:#6F6B65;--line:#DEDAD3;--band:#0E0E0E;--field:#F1EFEA}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
[hidden]{display:none!important}
header{background:var(--band);color:#fff;padding:18px 20px 16px}
header .k{font:600 11px/1 Inter;letter-spacing:.2em;text-transform:uppercase;color:#9a968f}
header .bar{height:5px;background:#2a2a2a;margin-top:14px;border-radius:3px;overflow:hidden}
header .bar i{display:block;height:100%;background:#fff;width:0;transition:width .3s}
main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:26px 20px 30px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:Archivo,'Arial Narrow',sans-serif;font-stretch:80%;font-weight:900;text-transform:uppercase;margin:0 0 0 -4px;line-height:1.42}
h1{font-size:40px}h2{font-size:29px}
h1 span,h2 span{background:var(--band);color:#fff;padding:1px 9px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
p{margin:0}.lead{font-size:17px}.muted{color:var(--muted);font-size:14px}
.opts{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{border:1.5px solid var(--ink);padding:8px 12px;font:700 12px/1 Inter;letter-spacing:.12em;text-transform:uppercase}
.op{font:600 16px/1.3 Inter;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;display:flex;gap:12px;align-items:center}
.op:before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);flex:none}
.op[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.op[aria-pressed="true"]:before{background:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.op small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:3px}
label.f{display:flex;flex-direction:column;gap:6px;font:600 12px/1 Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input,textarea{font:500 17px/1.3 Inter;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,.op:focus-visible,.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{border:0;background:var(--ink);color:var(--bg);font:700 14px/1 Inter;letter-spacing:.08em;text-transform:uppercase;padding:18px;border-radius:10px;cursor:pointer;text-align:center;text-decoration:none;display:block;width:100%}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.nav{display:flex;gap:10px;margin-top:auto;padding-top:10px}.nav .btn.ghost{flex:0 0 34%}
.card{background:var(--surface);border-left:5px solid var(--ink);padding:14px 16px}
.inc{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.card b{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.dk{background:var(--band);color:#fff;padding:18px}.dk p{color:#E6E3DD}
.lst{display:flex;flex-direction:column;gap:8px;margin:4px 0}
.lst div{background:var(--surface);padding:12px 14px;border-left:5px solid var(--ink);font-size:15px}
.err{color:#B42318;font-size:14px}
footer{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);max-width:520px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font:800 11px/1 Archivo;font-stretch:90%;letter-spacing:.22em;color:var(--ink)}
.pul{width:26px;height:9px;border-radius:5px;background:var(--band)}
</style>
</head><body>
<header><div class="k">Consultoria de treino · Igor Merino</div><div class="bar"><i id="barra"></i></div></header>
<main id="app"></main>
<footer><span class="brand"><span class="pul"></span>IGOR MERINO</span><span>Músculo é seguro de vida.</span></footer>
<script>
const WHATSAPP = '5565996856769';
// cada pergunta: id, título, texto de apoio, opções (ou campos)
const P = [
  { id: 'objetivo', t: 'Qual é o seu objetivo principal?', o: ['Ganhar massa muscular', 'Emagrecer sem perder músculo', 'Ganhar força e desempenho', 'Saúde e disposição'] },
  { id: 'experiencia', t: 'Há quanto tempo você treina musculação?', o: ['Ainda não treino', 'Menos de 6 meses', 'De 6 meses a 2 anos', 'Mais de 2 anos'] },
  { id: 'local', t: 'Onde você vai treinar?', o: ['Academia completa', 'Academia de condomínio ou do prédio', 'Em casa, com poucos equipamentos'] },
  { id: 'dias', t: 'Quantos dias por semana você consegue treinar?', o: ['2 dias', '3 dias', '4 dias', '5 dias ou mais'] },
  { id: 'tempo', t: 'Quanto tempo você tem por treino?', o: ['Até 45 minutos', 'De 45 minutos a 1 hora', 'Mais de 1 hora'] },
  { id: 'lesao', t: 'Tem alguma dor, lesão ou restrição?', o: ['Não', 'Sim'], extra: 'Qual? (ex.: dor no joelho, cirurgia no ombro)' },
  { id: 'formato', t: 'Como funciona a consultoria', txt: '<b>Você não fica sozinho.</b><ul class="inc"><li>Treino de 4 semanas montado para você, em PDF e numa ficha digital no celular para anotar suas cargas</li><li>Meu WhatsApp, para entender cada parte do treino, tirar dúvidas e trocar feedbacks por áudio</li><li>Grupo no WhatsApp para conversar, compartilhar com a turma e acompanhar as metas do mês</li><li>Correção da execução 1 vez por semana: você envia o vídeo do exercício e eu corrijo</li></ul>', o: ['Perfeito, quero começar', 'Quero entender melhor antes'] },
  { id: 'contato', t: 'Para finalizar, seus dados', campos: [['nome', 'Nome', 'text', 'Seu nome'], ['idade', 'Idade', 'number', 'Ex.: 38'], ['cidade', 'Cidade', 'text', 'Ex.: Cuiabá']] },
];
const R = {}; let i = -1;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const app = document.getElementById('app');

function tela() {
  document.getElementById('barra').style.width = i < 0 ? '0' : Math.min(100, ((i + 1) / P.length) * 100) + '%';
  if (i < 0) return inicio();
  if (i >= P.length) return fim();
  const q = P[i];
  let h = `<p class="muted">Pergunta ${i + 1} de ${P.length}</p><h2><span>${q.t}</span></h2>`;
  if (q.txt) h += `<div class="card">${q.txt}</div>`;
  if (q.o) h += `<div class="opts">${q.o.map((o, n) => `<button class="op" aria-pressed="${R[q.id] === o}" data-o="${n}">${o}</button>`).join('')}</div>`;
  if (q.extra) h += `<label class="f" id="extraBox" ${R[q.id] === 'Sim' ? '' : 'hidden'}>${q.extra}<textarea id="extra">${esc(R[q.id + '_qual'] || '')}</textarea></label>`;
  if (q.campos) h += q.campos.map(c => `<label class="f">${c[1]}<input id="${c[0]}" type="${c[2]}" ${c[2] === 'number' ? 'inputmode="numeric" min="12" max="99"' : ''} placeholder="${c[3]}" value="${esc(R[c[0]] || '')}" autocomplete="${c[0] === 'nome' ? 'name' : 'off'}"></label>`).join('') + `<p class="err" id="err" hidden>Preencha nome, idade e cidade.</p>`;
  h += `<div class="nav"><button class="btn ghost" id="voltar">Voltar</button><button class="btn" id="seguir" ${podeSeguir() ? '' : 'disabled'}>${i === P.length - 1 ? 'Ver resultado' : 'Continuar'}</button></div>`;
  app.innerHTML = h; window.scrollTo(0, 0);
}
function podeSeguir() { const q = P[i]; return q.campos ? true : !!R[q.id]; }
function inicio() {
  app.innerHTML = `<p class="muted">Consultoria de treino online · Igor Merino</p>
    <h1><span>Um corpo mais forte e mais bonito começa com direção.</span></h1>
    <p class="lead">Chega de treinar no escuro. Com um treino feito para você, cada ida à academia te deixa mais perto do que você quer: mais força, mais saúde, mais confiança.</p>
    <div class="chips"><span>Força</span><span>Saúde</span><span>Corpo firme</span><span>Beleza</span><span>Clareza</span></div>
    <div class="nav"><button class="btn" id="comecar">Quero começar</button></div>`;
}
function perfil() {
  const ok = R.experiencia !== 'Ainda não treino';
  return ok ? 'ideal' : 'avaliar';
}
function mensagem() {
  const L = [`Olá, Igor! Fiz o quiz da consultoria.`, '', `Nome: ${R.nome}`, `Idade: ${R.idade}`, `Cidade: ${R.cidade}`, '',
    `Objetivo: ${R.objetivo}`, `Treina há: ${R.experiencia}`, `Local: ${R.local}`, `Dias por semana: ${R.dias}`, `Tempo por treino: ${R.tempo}`,
    `Dor ou lesão: ${R.lesao === 'Sim' ? 'Sim, ' + (R.lesao_qual || 'não detalhei') : 'Não'}`, `Formato: ${R.formato}`, '', `Perfil: ${perfil() === 'ideal' ? 'IDEAL' : 'AVALIAR'}`];
  return `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(L.join('\n'))}`;
}
function fim() {
  const ideal = perfil() === 'ideal';
  const nome = esc((R.nome || '').split(' ')[0]);
  app.innerHTML = ideal
    ? `<h1><span>${nome}, você tem o perfil.</span></h1>
      <p class="lead">Pelas suas respostas, a consultoria combina com você.</p>
      <div class="dk"><p><b style="color:#fff">Último passo:</b> envie seu cadastro pelo WhatsApp. A mensagem já vai pronta, é só tocar em enviar. Eu confiro as vagas e te respondo.</p></div>
      <a class="btn" href="${mensagem()}" target="_blank" rel="noopener">Enviar meu cadastro no WhatsApp</a>
      <button class="btn ghost" id="refazer">Refazer o quiz</button>`
    : `<h1><span>Obrigado, ${nome}.</span></h1>
      <p class="lead">A consultoria funciona melhor para quem já tem alguma base de treino. Mesmo assim, envie seu cadastro: eu avalio o seu caso e te digo o melhor caminho.</p>
      <a class="btn" href="${mensagem()}" target="_blank" rel="noopener">Enviar meu cadastro no WhatsApp</a>
      <button class="btn ghost" id="refazer">Refazer o quiz</button>`;
}
app.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'comecar') { i = 0; tela(); }
  else if (b.id === 'refazer') { for (const k in R) delete R[k]; i = -1; tela(); }
  else if (b.dataset.o !== undefined) {
    const q = P[i]; R[q.id] = q.o[+b.dataset.o];
    app.querySelectorAll('.op').forEach(x => x.setAttribute('aria-pressed', x === b));
    const eb = document.getElementById('extraBox'); if (eb) eb.hidden = R[q.id] !== 'Sim';
    document.getElementById('seguir').disabled = false;
    if (!q.extra || R[q.id] !== 'Sim') setTimeout(() => { if (P[i] === q) { i++; tela(); } }, 250);
  }
  else if (b.id === 'voltar') { i--; tela(); }
  else if (b.id === 'seguir') {
    const q = P[i];
    if (q.extra) R[q.id + '_qual'] = (document.getElementById('extra') || {}).value || '';
    if (q.campos) {
      q.campos.forEach(c => R[c[0]] = document.getElementById(c[0]).value.trim());
      if (!R.nome || !R.idade || !R.cidade) { document.getElementById('err').hidden = false; return; }
    }
    i++; tela();
  }
});
tela();
</script>
</body></html>
